name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: A short, specific summary of the bug.
      placeholder: "internal context --budget rejects a valid negative value"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: The exact commands or actions that trigger the bug.
      placeholder: |
        1. Run `misterspec init --agent claude-code`
        2. Run `misterspec internal context SPEC-001 --budget -1`
        3. Observe ...
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The misterspec version or commit hash you're running (`git rev-parse HEAD` if built from source).
      placeholder: "v1.0.0-alpha or commit abc1234"
    validations:
      required: true
